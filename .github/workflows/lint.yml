name: Lint Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate skills and README
        run: python .github/scripts/validate_skills.py

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10"

      - name: Test validation rules
        run: python -m pytest tests/ -q
